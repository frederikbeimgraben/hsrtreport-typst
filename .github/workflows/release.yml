name: Create Release

on:
  push:
    tags:
      - "v*.*.*"
      - "release-*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v1.0.0)"
        required: true
        type: string
      is_prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

env:
  TYPST_VERSION: "0.15.1"

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Typst
        uses: ./.github/actions/install-typst
        with:
          version: ${{ env.TYPST_VERSION }}

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> "$GITHUB_OUTPUT"

      - name: Build document
        run: make build

      - name: Name the PDF after the tag
        run: cp build/main.pdf "Report_${{ steps.version.outputs.TAG }}.pdf"

      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "HSRTReport ${{ steps.version.outputs.TAG }}"
          files: Report_${{ steps.version.outputs.TAG }}.pdf
          prerelease: ${{ github.event.inputs.is_prerelease == 'true' }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
